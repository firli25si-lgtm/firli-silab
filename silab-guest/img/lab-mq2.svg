<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Blue Breakout PCB -->
  <rect x="80" y="50" width="240" height="200" rx="10" fill="#1E40AF" stroke="#1D4ED8" stroke-width="3"/>
  <!-- Stainless Steel Mesh Sensor Cap -->
  <circle cx="200" cy="130" r="55" fill="#94A3B8" stroke="#E2E8F0" stroke-width="5"/>
  <circle cx="200" cy="130" r="45" fill="#64748B"/>
  <!-- Cross Mesh Grill -->
  <line x1="160" y1="130" x2="240" y2="130" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="200" y1="90" x2="200" y2="170" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="170" y1="100" x2="230" y2="160" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="170" y1="160" x2="230" y2="100" stroke="#CBD5E1" stroke-width="2"/>
  <text x="200" y="136" font-family="Arial, sans-serif" font-size="14" fill="#FFF" font-weight="bold" text-anchor="middle">MQ-2</text>
  <!-- Trimpot & LED -->
  <rect x="120" y="195" width="25" height="25" rx="3" fill="#3B82F6"/>
  <circle cx="132" cy="207" r="5" fill="#F8FAFC"/>
  <circle cx="260" cy="200" r="5" fill="#10B981"/>
  <text x="200" y="205" font-family="Arial, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle" font-weight="bold">GAS / SMOKE DETECTOR</text>
  <!-- Pins -->
  <rect x="170" y="240" width="60" height="30" rx="2" fill="#0F172A"/>
  <rect x="175" y="260" width="5" height="25" fill="#F59E0B"/>
  <rect x="190" y="260" width="5" height="25" fill="#F59E0B"/>
  <rect x="205" y="260" width="5" height="25" fill="#F59E0B"/>
  <rect x="220" y="260" width="5" height="25" fill="#F59E0B"/>
</svg>
