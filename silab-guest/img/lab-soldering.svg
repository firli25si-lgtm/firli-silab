<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Station Base -->
  <rect x="40" y="70" width="200" height="180" rx="12" fill="#1E293B" stroke="#475569" stroke-width="4"/>
  <!-- Digital LED Temp Display -->
  <rect x="65" y="95" width="110" height="50" rx="6" fill="#000" stroke="#334155" stroke-width="2"/>
  <text x="80" y="132" font-family="monospace" font-size="30" fill="#38BDF8" font-weight="bold">350</text>
  <text x="150" y="115" font-family="Arial, sans-serif" font-size="14" fill="#38BDF8">°C</text>
  <!-- Temp Control Buttons & Knob -->
  <circle cx="100" cy="185" r="16" fill="#0F172A" stroke="#64748B" stroke-width="2"/>
  <polygon points="100,178 95,190 105,190" fill="#EF4444"/>
  <circle cx="150" cy="185" r="16" fill="#0F172A" stroke="#64748B" stroke-width="2"/>
  <polygon points="100,178 95,190 105,190" fill="#3B82F6" transform="rotate(180 150 185)"/>
  <!-- Soldering Iron Holder & Iron -->
  <polygon points="260,230 330,100 350,110 280,240" fill="#475569" stroke="#64748B" stroke-width="3"/>
  <!-- Iron Handle -->
  <line x1="280" y1="180" x2="350" y2="70" stroke="#3B82F6" stroke-width="22" stroke-linecap="round"/>
  <!-- Iron Grip Ring -->
  <line x1="315" y1="125" x2="330" y2="100" stroke="#1E293B" stroke-width="24"/>
  <!-- Metal Tip Collar -->
  <polygon points="265,205 285,175 295,182 275,212" fill="#94A3B8"/>
  <!-- Fine Point Tip -->
  <polygon points="250,225 270,195 260,210" fill="#F59E0B"/>
  <text x="140" y="235" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">ESD SAFE 60W</text>
</svg>
