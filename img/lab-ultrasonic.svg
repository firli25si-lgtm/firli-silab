<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Blue PCB Board -->
  <rect x="50" y="70" width="300" height="140" rx="8" fill="#1E40AF" stroke="#1D4ED8" stroke-width="3"/>
  <!-- Crystal Oscillator -->
  <rect x="175" y="120" width="50" height="22" rx="4" fill="#94A3B8" stroke="#CBD5E1" stroke-width="2"/>
  <text x="200" y="135" font-family="monospace" font-size="8" fill="#1E293B" text-anchor="middle">4.000MHz</text>
  <!-- ICs -->
  <rect x="180" y="85" width="40" height="25" rx="2" fill="#0F172A"/>
  <!-- Ultrasonic Transducer T (Transmitter) -->
  <circle cx="115" cy="130" r="45" fill="#475569" stroke="#E2E8F0" stroke-width="6"/>
  <circle cx="115" cy="130" r="32" fill="#1E293B"/>
  <text x="115" y="138" font-family="Arial, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle" font-weight="bold">T</text>
  <!-- Ultrasonic Transducer R (Receiver) -->
  <circle cx="285" cy="130" r="45" fill="#475569" stroke="#E2E8F0" stroke-width="6"/>
  <circle cx="285" cy="130" r="32" fill="#1E293B"/>
  <text x="285" y="138" font-family="Arial, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle" font-weight="bold">R</text>
  <!-- Sound Waves Graphic -->
  <path d="M 60 110 A 30 30 0 0 0 60 150" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  <path d="M 45 95 A 50 50 0 0 0 45 165" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  <!-- 4 Header Pins -->
  <rect x="160" y="200" width="80" height="40" rx="2" fill="#0F172A"/>
  <rect x="167" y="235" width="6" height="25" fill="#F59E0B"/>
  <rect x="187" y="235" width="6" height="25" fill="#F59E0B"/>
  <rect x="207" y="235" width="6" height="25" fill="#F59E0B"/>
  <rect x="227" y="235" width="6" height="25" fill="#F59E0B"/>
  <!-- Text Label -->
  <text x="200" y="195" font-family="Arial, sans-serif" font-size="12" fill="#FFF" font-weight="bold" text-anchor="middle">HC-SR04 SENSOR</text>
  <text x="170" y="275" font-family="Arial, sans-serif" font-size="8" fill="#64748B">VCC TRIG ECHO GND</text>
</svg>
