<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Sleek Aluminum Anodized Housing -->
  <rect x="70" y="60" width="260" height="170" rx="16" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
  <!-- USB Port on Left -->
  <rect x="45" y="125" width="30" height="40" rx="3" fill="#64748B" stroke="#94A3B8" stroke-width="2"/>
  <rect x="50" y="138" width="10" height="14" fill="#0F172A"/>
  <!-- Logo & Title -->
  <text x="140" y="105" font-family="Arial, sans-serif" font-size="18" fill="#38BDF8" font-weight="bold">LOGIC 8</text>
  <text x="140" y="125" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">24MHz 8-CHANNEL ANALYZER</text>
  <!-- 8 Signal Indicators -->
  <g transform="translate(130, 150)">
    <circle cx="10" cy="10" r="5" fill="#10B981"/><circle cx="28" cy="10" r="5" fill="#10B981"/>
    <circle cx="46" cy="10" r="5" fill="#10B981"/><circle cx="64" cy="10" r="5" fill="#10B981"/>
    <circle cx="82" cy="10" r="5" fill="#10B981"/><circle cx="100" cy="10" r="5" fill="#10B981"/>
    <circle cx="118" cy="10" r="5" fill="#10B981"/><circle cx="136" cy="10" r="5" fill="#10B981"/>
  </g>
  <!-- Pin Header on Right -->
  <rect x="300" y="95" width="40" height="100" rx="4" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <circle cx="315" cy="110" r="4" fill="#F59E0B"/><circle cx="315" cy="125" r="4" fill="#F59E0B"/>
  <circle cx="315" cy="140" r="4" fill="#F59E0B"/><circle cx="315" cy="155" r="4" fill="#F59E0B"/>
  <circle cx="315" cy="170" r="4" fill="#F59E0B"/><circle cx="315" cy="185" r="4" fill="#F59E0B"/>
  <!-- Digital Pulse Line -->
  <path d="M 90 200 H 120 V 180 H 150 V 200 H 180 V 180 H 220 V 200 H 280" fill="none" stroke="#10B981" stroke-width="2"/>
</svg>
