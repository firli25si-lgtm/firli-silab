<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>
  <rect x="20" y="30" width="360" height="240" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="4"/>
  <rect x="40" y="50" width="230" height="180" rx="8" fill="url(#screen)" stroke="#059669" stroke-width="2"/>
  <!-- Grid -->
  <path d="M 40 95 H 270 M 40 140 H 270 M 40 185 H 270 M 97 50 V 230 M 155 50 V 230 M 212 50 V 230" stroke="#065F46" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Waveform 1 (Sine) -->
  <path d="M 40 140 Q 68 80 97 140 T 155 140 T 212 140 T 270 140" fill="none" stroke="#10B981" stroke-width="3"/>
  <!-- Waveform 2 (Square) -->
  <path d="M 40 180 H 68 V 100 H 97 V 180 H 126 V 100 H 155 V 180 H 184 V 100 H 212 V 180 H 241 V 100 H 270" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.8"/>
  <!-- Knobs & Buttons -->
  <circle cx="320" cy="80" r="22" fill="#334155" stroke="#64748B" stroke-width="3"/>
  <circle cx="320" cy="80" r="6" fill="#10B981"/>
  <circle cx="320" cy="140" r="18" fill="#334155" stroke="#64748B" stroke-width="3"/>
  <circle cx="320" cy="140" r="5" fill="#3B82F6"/>
  <circle cx="320" cy="195" r="18" fill="#334155" stroke="#64748B" stroke-width="3"/>
  <circle cx="320" cy="195" r="5" fill="#EF4444"/>
  <!-- BNC Connectors -->
  <circle cx="80" cy="250" r="7" fill="#64748B" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="120" cy="250" r="7" fill="#64748B" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="160" cy="250" r="7" fill="#64748B" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="200" cy="250" r="7" fill="#64748B" stroke="#94A3B8" stroke-width="2"/>
  <!-- Text -->
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="12" fill="#34D399" font-weight="bold">CH1: 2.50V  1.00kHz</text>
  <text x="290" y="245" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">DIGITAL 100MHz</text>
</svg>
