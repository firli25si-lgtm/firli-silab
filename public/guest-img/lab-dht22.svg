<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- White Perforated Plastic Body -->
  <rect x="120" y="30" width="160" height="200" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4"/>
  <!-- Mesh Grid Grill -->
  <g fill="#94A3B8">
    <circle cx="150" cy="65" r="4"/><circle cx="175" cy="65" r="4"/><circle cx="200" cy="65" r="4"/><circle cx="225" cy="65" r="4"/><circle cx="250" cy="65" r="4"/>
    <circle cx="150" cy="85" r="4"/><circle cx="175" cy="85" r="4"/><circle cx="200" cy="85" r="4"/><circle cx="225" cy="85" r="4"/><circle cx="250" cy="85" r="4"/>
    <circle cx="150" cy="105" r="4"/><circle cx="175" cy="105" r="4"/><circle cx="200" cy="105" r="4"/><circle cx="225" cy="105" r="4"/><circle cx="250" cy="105" r="4"/>
    <circle cx="150" cy="125" r="4"/><circle cx="175" cy="125" r="4"/><circle cx="200" cy="125" r="4"/><circle cx="225" cy="125" r="4"/><circle cx="250" cy="125" r="4"/>
    <circle cx="150" cy="145" r="4"/><circle cx="175" cy="145" r="4"/><circle cx="200" cy="145" r="4"/><circle cx="225" cy="145" r="4"/><circle cx="250" cy="145" r="4"/>
  </g>
  <!-- Text on sensor -->
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="18" fill="#1E293B" font-weight="bold" text-anchor="middle">DHT22</text>
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">TEMP &amp; HUMIDITY</text>
  <!-- 4 Metal Pins -->
  <rect x="145" y="230" width="8" height="45" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
  <rect x="175" y="230" width="8" height="45" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
  <rect x="205" y="230" width="8" height="45" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
  <rect x="235" y="230" width="8" height="45" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
  <text x="149" y="290" font-family="Arial, sans-serif" font-size="8" fill="#64748B" text-anchor="middle">VCC</text>
  <text x="179" y="290" font-family="Arial, sans-serif" font-size="8" fill="#64748B" text-anchor="middle">DATA</text>
  <text x="209" y="290" font-family="Arial, sans-serif" font-size="8" fill="#64748B" text-anchor="middle">NC</text>
  <text x="239" y="290" font-family="Arial, sans-serif" font-size="8" fill="#64748B" text-anchor="middle">GND</text>
