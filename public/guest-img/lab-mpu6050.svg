<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Cyan/Blue Breakout Board -->
  <rect x="70" y="40" width="260" height="220" rx="10" fill="#0284C7" stroke="#0369A1" stroke-width="3"/>
  <!-- Center MPU Chip -->
  <rect x="150" y="90" width="100" height="100" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <!-- Pin 1 Dot -->
  <circle cx="165" cy="105" r="4" fill="#64748B"/>
  <text x="200" y="140" font-family="Arial, sans-serif" font-size="14" fill="#38BDF8" font-weight="bold" text-anchor="middle">MPU-6050</text>
  <text x="200" y="160" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">6-AXIS GYRO/ACCEL</text>
  <!-- 3D Axes Graphic -->
  <line x1="200" y1="90" x2="200" y2="60" stroke="#EF4444" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="250" y1="140" x2="280" y2="140" stroke="#10B981" stroke-width="3"/>
  <text x="200" y="55" font-family="Arial, sans-serif" font-size="10" fill="#EF4444" font-weight="bold" text-anchor="middle">+Y</text>
  <text x="290" y="144" font-family="Arial, sans-serif" font-size="10" fill="#10B981" font-weight="bold">+X</text>
  <!-- Header Pins on Left -->
  <circle cx="95" cy="65" r="6" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
  <circle cx="95" cy="90" r="6" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
  <circle cx="95" cy="115" r="6" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
  <circle cx="95" cy="140" r="6" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
  <circle cx="95" cy="165" r="6" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
  <circle cx="95" cy="190" r="6" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
  <circle cx="95" cy="215" r="6" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
  <circle cx="95" cy="240" r="6" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
  <!-- Pin Labels -->
  <text x="110" y="70" font-family="Arial, sans-serif" font-size="8" fill="#FFF">VCC</text>
  <text x="110" y="95" font-family="Arial, sans-serif" font-size="8" fill="#FFF">GND</text>
  <text x="110" y="120" font-family="Arial, sans-serif" font-size="8" fill="#FFF">SCL</text>
  <text x="110" y="145" font-family="Arial, sans-serif" font-size="8" fill="#FFF">SDA</text>
  <text x="110" y="170" font-family="Arial, sans-serif" font-size="8" fill="#FFF">XDA</text>
  <text x="110" y="195" font-family="Arial, sans-serif" font-size="8" fill="#FFF">XCL</text>
  <text x="110" y="220" font-family="Arial, sans-serif" font-size="8" fill="#FFF">AD0</text>
  <text x="110" y="245" font-family="Arial, sans-serif" font-size="8" fill="#FFF">INT</text>
</svg>
