<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="psubg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect x="30" y="30" width="340" height="240" rx="12" fill="url(#psubg)" stroke="#475569" stroke-width="4"/>
  <!-- Seven Segment Displays -->
  <rect x="55" y="55" width="130" height="65" rx="6" fill="#000" stroke="#1E293B" stroke-width="2"/>
  <text x="70" y="100" font-family="monospace" font-size="34" fill="#EF4444" font-weight="bold">12.00</text>
  <text x="160" y="75" font-family="Arial, sans-serif" font-size="12" fill="#EF4444">V</text>
  
  <rect x="215" y="55" width="130" height="65" rx="6" fill="#000" stroke="#1E293B" stroke-width="2"/>
  <text x="230" y="100" font-family="monospace" font-size="34" fill="#3B82F6" font-weight="bold">02.50</text>
  <text x="320" y="75" font-family="Arial, sans-serif" font-size="12" fill="#3B82F6">A</text>
  
  <!-- Knobs Voltage / Current -->
  <circle cx="100" cy="165" r="22" fill="#0F172A" stroke="#64748B" stroke-width="3"/>
  <rect x="98" y="145" width="4" height="15" fill="#EF4444"/>
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">VOLTAGE</text>

  <circle cx="160" cy="165" r="16" fill="#0F172A" stroke="#64748B" stroke-width="2"/>
  <text x="160" y="200" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">FINE</text>

  <circle cx="240" cy="165" r="22" fill="#0F172A" stroke="#64748B" stroke-width="3"/>
  <rect x="238" y="145" width="4" height="15" fill="#3B82F6"/>
  <text x="240" y="200" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">CURRENT</text>

  <circle cx="300" cy="165" r="16" fill="#0F172A" stroke="#64748B" stroke-width="2"/>
  <text x="300" y="200" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">FINE</text>

  <!-- Output Terminals -->
  <circle cx="150" cy="240" r="10" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>
  <circle cx="200" cy="240" r="10" fill="#16A34A" stroke="#166534" stroke-width="2"/>
  <circle cx="250" cy="240" r="10" fill="#1E293B" stroke="#000" stroke-width="2"/>
  <text x="150" y="262" font-family="Arial, sans-serif" font-size="9" fill="#F8FAFC" text-anchor="middle">(+)</text>
  <text x="200" y="262" font-family="Arial, sans-serif" font-size="9" fill="#F8FAFC" text-anchor="middle">GND</text>
  <text x="250" y="262" font-family="Arial, sans-serif" font-size="9" fill="#F8FAFC" text-anchor="middle">(-)</text>
  <!-- Power Switch -->
  <rect x="55" y="225" width="35" height="25" rx="3" fill="#10B981"/>
  <text x="72" y="242" font-family="Arial, sans-serif" font-size="9" fill="#FFF" text-anchor="middle" font-weight="bold">ON</text>
</svg>
