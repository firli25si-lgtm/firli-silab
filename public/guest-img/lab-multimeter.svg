<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Rubber Holster -->
  <rect x="90" y="20" width="220" height="260" rx="24" fill="url(#body)" stroke="#B45309" stroke-width="4"/>
  <!-- Dark Face -->
  <rect x="105" y="35" width="190" height="230" rx="16" fill="#1E293B"/>
  <!-- LCD Screen -->
  <rect x="120" y="50" width="160" height="65" rx="8" fill="#ECFCCB" stroke="#84CC16" stroke-width="2"/>
  <text x="140" y="95" font-family="monospace" font-size="34" fill="#14532D" font-weight="bold">230.4</text>
  <text x="248" y="75" font-family="Arial, sans-serif" font-size="14" fill="#14532D" font-weight="bold">V AC</text>
  <text x="135" y="108" font-family="Arial, sans-serif" font-size="9" fill="#4D7C0F">AUTO RANGE  TRUE RMS</text>
  <!-- Rotary Dial -->
  <circle cx="200" cy="165" r="40" fill="#0F172A" stroke="#475569" stroke-width="3"/>
  <circle cx="200" cy="165" r="32" fill="#334155"/>
  <rect x="197" y="130" width="6" height="25" rx="2" fill="#F59E0B"/>
  <!-- Dial Labels -->
  <text x="195" y="122" font-family="Arial, sans-serif" font-size="10" fill="#F8FAFC" text-anchor="middle" font-weight="bold">V~</text>
  <text x="245" y="150" font-family="Arial, sans-serif" font-size="10" fill="#F8FAFC" font-weight="bold">V=</text>
  <text x="240" y="190" font-family="Arial, sans-serif" font-size="10" fill="#F8FAFC" font-weight="bold">Ω</text>
  <text x="195" y="215" font-family="Arial, sans-serif" font-size="10" fill="#F8FAFC" text-anchor="middle" font-weight="bold">A</text>
  <text x="150" y="170" font-family="Arial, sans-serif" font-size="10" fill="#EF4444" font-weight="bold">OFF</text>
  <!-- Input Jacks -->
  <circle cx="150" cy="245" r="8" fill="#EF4444" stroke="#7F1D1D" stroke-width="2"/>
  <circle cx="185" cy="245" r="8" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <circle cx="220" cy="245" r="8" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <circle cx="255" cy="245" r="8" fill="#EF4444" stroke="#7F1D1D" stroke-width="2"/>
  <text x="185" y="258" font-family="Arial, sans-serif" font-size="7" fill="#94A3B8" text-anchor="middle">COM</text>
</svg>
